<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>封面编辑台</title><link rel="stylesheet" href="style.css"><style>main{max-width:1200px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.item{border:1px solid var(--line);padding:12px}.preview{aspect-ratio:4/5;background:#eee;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}.item label{display:block;font-size:12px;margin-top:8px}.item input{width:100%}</style><body><nav class="top"><a href="index.html">← 返回网站</a><b>閲読器作品記録｜封面编辑台</b></nav><main><h1>封面编辑台</h1><p>先上传图片，再拖动横向或纵向滑杆；预览会立即更新。</p><button id="export">导出修改清单</button><div id="list" class="grid"></div></main><script>let edits=JSON.parse(localStorage.getItem('ydq-cover-edits')||'{}'),save=()=>localStorage.setItem('ydq-cover-edits',JSON.stringify(edits));fetch('index.html').then(r=>r.text()).then(t=>{let d=document.createElement('div');d.innerHTML=t;list.innerHTML=[...d.querySelectorAll('#catalog .card')].map(c=>{let id=c.querySelector('a').getAttribute('href').match(/work-\d+/)[0],n=c.querySelector('h3').textContent,e=edits[id]||{},i=c.querySelector('img');return `<section class="item" data-id="${id}"><div class="preview">${i?`<img src="${i.src}" style="object-position:${e.position||'50% 50%'}">`:'<span>上传封面后预览</span>'}</div><b>${n}</b><label>图片 <input class="file" type="file" accept="image/*"></label><label>横向 <input class="x" type="range" min="0" max="100" value="${e.x||50}"></label><label>纵向 <input class="y" type="range" min="0" max="100" value="${e.y||50}"></label></section>`}).join('');document.querySelectorAll('.item').forEach(c=>{let id=c.dataset.id,update=()=>{let x=c.querySelector('.x').value,y=c.querySelector('.y').value;edits[id]={...(edits[id]||{}),x,y,position:`${x}% ${y}%`};c.querySelector('img')?.style.setProperty('object-position',edits[id].position);save()};c.querySelector('.x').oninput=update;c.querySelector('.y').oninput=update;c.querySelector('.file').onchange=e=>{let f=e.target.files[0];if(!f)return;edits[id]={...(edits[id]||{}),file:f.name};let u=URL.createObjectURL(f),p=c.querySelector('.preview');p.innerHTML=`<img src="${u}" style="object-position:${edits[id].position||'50% 50%'}">`;update()}})});export.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(edits,null,2)],{type:'application/json'}));a.download='cover-overrides.json';a.click()}</script></body></html>
