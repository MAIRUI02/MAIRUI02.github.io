<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <defs>
    <style>
      @keyframes svgHop1 { 0%, 100% { transform: translateY(0) scale(1.05, 0.95); } 45% { transform: translateY(-30px) scale(0.95, 1.08); } }
      @keyframes svgHop2 { 0%, 100% { transform: translateY(0) scale(1.05, 0.95); } 45% { transform: translateY(-30px) scale(0.95, 1.08); } }
      @keyframes svgHop3 { 0%, 100% { transform: translateY(0) scale(1.05, 0.95); } 45% { transform: translateY(-30px) scale(0.95, 1.08); } }
      @keyframes svgHop4 { 0%, 100% { transform: translateY(0) scale(1.05, 0.95); } 45% { transform: translateY(-30px) scale(0.95, 1.08); } }
      
      .hop-rabbit-1 { animation: svgHop1 1.6s ease-in-out infinite; animation-delay: 0s; transform-origin: 60px 120px; }
      .hop-rabbit-2 { animation: svgHop2 1.6s ease-in-out infinite; animation-delay: 0.28s; transform-origin: 190px 120px; }
      .hop-rabbit-3 { animation: svgHop3 1.6s ease-in-out infinite; animation-delay: 0.56s; transform-origin: 320px 120px; }
      .hop-rabbit-4 { animation: svgHop4 1.6s ease-in-out infinite; animation-delay: 0.84s; transform-origin: 440px 120px; }
    </style>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#a65472" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Transparent fused guide dashed track -->
  <line x1="20" y1="138" x2="520" y2="138" stroke="#e8a8be" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.5"/>

  <!-- 4 Pink Pixel/Silhouette Rabbits Progression -->
  <g fill="#f89cb6" filter="url(#softShadow)" shape-rendering="crispEdges">
    <!-- RABBIT 1: Leaping / Sprinting Forward (x: 20-135, y: 55-125) -->
    <g class="hop-rabbit-1" transform="translate(16, 52)">
      <!-- Tail -->
      <rect x="0" y="32" width="12" height="10"/>
      <rect x="2" y="28" width="8" height="16"/>
      <!-- Rear legs outstretched back -->
      <rect x="12" y="40" width="22" height="10"/>
      <rect x="22" y="48" width="16" height="8"/>
      <!-- Body -->
      <rect x="10" y="24" width="46" height="20"/>
      <rect x="14" y="20" width="38" height="26"/>
      <rect x="20" y="16" width="30" height="32"/>
      <rect x="42" y="18" width="26" height="26"/>
      <rect x="52" y="22" width="20" height="24"/>
      <!-- Neck & Head -->
      <rect x="64" y="24" width="22" height="20"/>
      <rect x="70" y="20" width="18" height="24"/>
      <rect x="80" y="26" width="12" height="14"/>
      <!-- Front legs reaching forward -->
      <rect x="66" y="44" width="14" height="14"/>
      <rect x="74" y="52" width="18" height="8"/>
      <rect x="84" y="56" width="14" height="6"/>
      <!-- Back-swept Ears -->
      <rect x="68" y="12" width="10" height="12"/>
      <rect x="70" y="4" width="8" height="12"/>
      <rect x="72" y="0" width="6" height="8"/>
      <rect x="78" y="16" width="8" height="10"/>
      <rect x="80" y="10" width="6" height="10"/>
    </g>

    <!-- RABBIT 2: Crouching / Rounded Sitting (x: 140-245, y: 52-125) -->
    <g class="hop-rabbit-2" transform="translate(150, 50)">
      <!-- Fluffy Tail -->
      <rect x="0" y="40" width="10" height="12"/>
      <rect x="2" y="36" width="8" height="18"/>
      <!-- Chunky body & haunches -->
      <rect x="8" y="30" width="44" height="28"/>
      <rect x="12" y="24" width="40" height="36"/>
      <rect x="18" y="18" width="32" height="42"/>
      <rect x="14" y="58" width="40" height="8"/>
      <!-- Chest and front paws -->
      <rect x="44" y="28" width="22" height="32"/>
      <rect x="52" y="54" width="16" height="12"/>
      <!-- Head -->
      <rect x="50" y="20" width="24" height="22"/>
      <rect x="56" y="16" width="16" height="24"/>
      <rect x="68" y="24" width="12" height="14"/>
      <!-- Upright perky ears -->
      <rect x="54" y="6" width="8" height="14"/>
      <rect x="54" y="0" width="6" height="10"/>
      <rect x="62" y="8" width="7" height="12"/>
      <rect x="62" y="2" width="6" height="10"/>
    </g>

    <!-- RABBIT 3: Mid-air Low Sprint (x: 250-380, y: 60-125) -->
    <g class="hop-rabbit-3" transform="translate(270, 60)">
      <!-- Stretched rear legs -->
      <rect x="0" y="28" width="18" height="10"/>
      <rect x="4" y="24" width="16" height="14"/>
      <rect x="14" y="34" width="16" height="8"/>
      <!-- Long sleek torso -->
      <rect x="16" y="20" width="50" height="20"/>
      <rect x="20" y="16" width="44" height="26"/>
      <rect x="28" y="12" width="32" height="30"/>
      <!-- Reaching forelegs -->
      <rect x="60" y="34" width="18" height="12"/>
      <rect x="70" y="40" width="16" height="8"/>
      <!-- Aerodynamic head -->
      <rect x="60" y="18" width="22" height="18"/>
      <rect x="64" y="14" width="16" height="22"/>
      <rect x="76" y="20" width="10" height="12"/>
      <!-- Streamlined ears -->
      <rect x="66" y="6" width="8" height="10"/>
      <rect x="68" y="0" width="6" height="8"/>
      <rect x="72" y="8" width="6" height="8"/>
    </g>

    <!-- RABBIT 4: Alert Upright Bunny (x: 390-480, y: 40-125) -->
    <g class="hop-rabbit-4" transform="translate(410, 42)">
      <!-- Tail -->
      <rect x="0" y="52" width="10" height="12"/>
      <!-- Tall standing body -->
      <rect x="6" y="40" width="34" height="30"/>
      <rect x="10" y="32" width="30" height="40"/>
      <rect x="8" y="68" width="36" height="8"/>
      <!-- Paws resting forward -->
      <rect x="30" y="34" width="22" height="34"/>
      <rect x="40" y="58" width="16" height="16"/>
      <!-- Head held high -->
      <rect x="28" y="22" width="24" height="20"/>
      <rect x="32" y="18" width="20" height="24"/>
      <rect x="46" y="24" width="12" height="12"/>
      <!-- Very tall curious ears -->
      <rect x="30" y="6" width="7" height="16"/>
      <rect x="30" y="0" width="6" height="8"/>
      <rect x="38" y="8" width="7" height="14"/>
      <rect x="38" y="2" width="6" height="8"/>
    </g>
  </g>
</svg>
