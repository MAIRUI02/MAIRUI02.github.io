<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>封面编辑台 v3</title><style>body{font:16px system-ui;margin:30px;background:#fffaf1;color:#332b35}#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.item{background:#fff;border:1px solid #dfcfc2;padding:12px}.preview{aspect-ratio:16/9;background:#eee;overflow:hidden;margin-bottom:8px}.preview img{width:100%;height:100%;object-fit:cover}label{display:block;margin-top:8px;font-size:13px}input{width:100%}button{margin:14px 0;padding:9px 14px}</style><h1>封面编辑台</h1><p>上传图片后，横向、纵向滑杆会实时更新预览。</p><button id="exportBtn">导出修改清单</button><div id="list">正在读取作品库…</div><script>const box=document.getElementById('list'),edits=JSON.parse(localStorage.getItem('ydq-cover-edits')||'{}');function save(){localStorage.setItem('ydq-cover-edits',JSON.stringify(edits))}fetch('./index.html').then(r=>{if(!r.ok)throw Error();return r.text()}).then(t=>{const d=document.createElement('div');d.innerHTML=t;const cards=[...d.querySelectorAll('#catalog .card')];if(!cards.length)throw Error();box.innerHTML=cards.map(c=>{const id=c.querySelector('a').href.match(/work-\d+/)[0],name=c.querySelector('h3').textContent,e=edits[id]||{},img=c.querySelector('img');return `<div class="item" data-id="${id}"><div class="preview">${img?`<img src="${img.getAttribute('src')}" style="object-position:${e.position||'50% 50%'}">`:'上传图片后预览'}</div><b>${name}</b><label>上传封面<input class="file" type="file" accept="image/*"></label><label>横向<input class="x" type="range" min="0" max="100" value="${e.x||50}"></label><label>纵向<input class="y" type="range" min="0" max="100" value="${e.y||50}"></label></div>`}).join('');document.querySelectorAll('.item').forEach(el=>{const id=el.dataset.id,apply=()=>{const x=el.querySelector('.x').value,y=el.querySelector('.y').value;edits[id]={...(edits[id]||{}),x,y,position:`${x}% ${y}%`};el.querySelector('.preview img')?.style.setProperty('object-position',edits[id].position);save()};el.querySelector('.x').oninput=apply;el.querySelector('.y').oninput=apply;el.querySelector('.file').onchange=e=>{const f=e.target.files[0];if(!f)return;edits[id]={...(edits[id]||{}),file:f.name};el.querySelector('.preview').innerHTML=`<img src="${URL.createObjectURL(f)}">`;apply()}})}).catch(()=>box.textContent='读取失败。请确认使用 http://localhost:8080/manage-v3.html 打开。');document.getElementById('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(edits,null,2)],{type:'application/json'}));a.download='cover-overrides.json';a.click()}</script>
