<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>封面微调台｜閲読器作品記録</title>
  <style>
    :root{--ink:#28352d;--paper:#fffaf0;--mint:#dce8d2;--line:#425844;--accent:#a25964}*{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Noto Serif SC",serif}.bar{padding:16px max(5vw,22px);border-bottom:3px solid var(--line);background:#eff5e6;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.bar a{color:inherit}.wrap{max-width:1640px;margin:auto;padding:42px 24px 90px}h1{font-size:clamp(30px,5vw,50px);margin:0}.lead{max-width:760px}.panel{border:3px solid var(--line);background:var(--mint);padding:20px;box-shadow:6px 6px 0 #8da181}.button{display:inline-block;border:2px solid var(--line);background:#fffdf3;padding:9px 14px;color:inherit;cursor:pointer;font:inherit}.button.primary{background:#52715b;color:#fff}.note{font-size:14px;margin-bottom:0}.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:32px}.item{border:2px solid var(--line);background:#fffdf6;padding:12px;box-shadow:3px 3px 0 #c2d0bb}.preview{aspect-ratio:16/9;background:#e6e6df;overflow:hidden;display:grid;place-items:center;color:#6d756a}.preview img{width:100%;height:100%;object-fit:cover;display:block}.item b{display:block;line-height:1.35;margin:10px 0 4px}.item label{display:block;font-size:13px;margin-top:9px}.item input{width:100%}.values{font:13px/1.4 ui-monospace,monospace;color:#566457;margin-top:7px}.changed{outline:3px solid #d69762;outline-offset:2px}@media(max-width:900px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.wrap{padding:28px 14px}.panel{padding:16px}.list{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav class="bar"><a href="index.html">← 返回网站</a><span>閲読器作品記録 · COVER TUNING</span></nav>
  <main class="wrap">
    <h1>封面微调台</h1>
    <p class="lead">拖动每张作品下方的三个滑条，预览会立即变化。完成后点击「导出微调文件」，将下载的 <code>cover-overrides.json</code> 发给我即可；我会把它合入网站，不需要你逐张描述数值。</p>
    <section class="panel">
      <input id="work-search" type="search" placeholder="搜索作品名，例如：换乘恋爱" aria-label="搜索作品名">
      <button class="button primary" id="export">导出微调文件</button>
      <button class="button" id="reset">还原本机草稿</button>
      <p class="note">横向：左右移动主体；纵向：上下移动主体；缩放：放大细节。只有被改动的作品会写入导出文件。</p>
    </section>
    <section id="list" class="list"></section>
  </main>
  <script>
    const list = document.querySelector('#list');
    const search = document.querySelector('#work-search');
    const key = 'ydq-cover-tuning-v1';
    const saved = JSON.parse(localStorage.getItem(key) || '{}');
    let works = [];
    const defaultFocus = { x: 50, y: 20, zoom: 100 };
    const esc = value => String(value).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function entry(id) { return { ...defaultFocus, ...(saved[id] || {}) }; }
    function draw() {
      const query = search.value.trim().toLowerCase();
      const visibleWorks = query ? works.filter(w => w.name.toLowerCase().includes(query)) : works;
      list.innerHTML = visibleWorks.map(w => {
        const v = entry(w.id);
        return `<article class="item" data-id="${w.id}"><div class="preview"><img src="${esc(w.cover)}" alt=""></div><b>${esc(w.name)}</b><label>横向裁剪 <input class="x" type="range" min="0" max="100" value="${v.x}"></label><label>纵向裁剪 <input class="y" type="range" min="0" max="100" value="${v.y}"></label><label>缩放 <input class="zoom" type="range" min="100" max="155" value="${v.zoom}"></label><div class="values"></div></article>`;
      }).join('');
      list.querySelectorAll('.item').forEach(card => {
        const sync = () => {
          const id = card.dataset.id, x = Number(card.querySelector('.x').value), y = Number(card.querySelector('.y').value), zoom = Number(card.querySelector('.zoom').value);
          const image = card.querySelector('img');
          image.style.objectPosition = `${x}% ${y}%`;
          image.style.transformOrigin = `${x}% ${y}%`;
          image.style.transform = `scale(${zoom / 100})`;
          card.querySelector('.values').textContent = `位置：${x}% / ${y}%　缩放：${zoom}%`;
          const changed = x !== defaultFocus.x || y !== defaultFocus.y || zoom !== defaultFocus.zoom;
          card.classList.toggle('changed', changed);
          if (changed) saved[id] = { x, y, zoom, position: `${x}% ${y}%` }; else delete saved[id];
          localStorage.setItem(key, JSON.stringify(saved));
        };
        card.querySelectorAll('input').forEach(input => input.addEventListener('input', sync));
        sync();
      });
    }
    fetch('index.html').then(r => r.text()).then(html => {
      const doc = document.createElement('div'); doc.innerHTML = html;
      works = [...doc.querySelectorAll('#catalog .card')].map(card => {
        const link = card.querySelector('a'), image = card.querySelector('img');
        return { id: link.getAttribute('href').match(/work-\d+/)[0], name: card.querySelector('h3').textContent.trim(), cover: image?.getAttribute('src') || '' };
      });
      draw();
    }).catch(() => { list.innerHTML = '<p>作品库读取失败，请从已部署的网站打开此页面。</p>'; });
    search.addEventListener('input', draw);
    document.querySelector('#export').onclick = () => {
      const data = Object.fromEntries(Object.entries(saved));
      const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cover-overrides.json'; a.click(); URL.revokeObjectURL(a.href);
    };
    document.querySelector('#reset').onclick = () => {
      if (confirm('要清空这台设备暂存的所有微调吗？')) { localStorage.removeItem(key); location.reload(); }
    };
  </script>
</body>
</html>
