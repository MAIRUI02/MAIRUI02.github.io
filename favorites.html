<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的心选清单 · 閲読器作品記録</title>
  <meta name="description" content="访客私人心选作品清单，本地持久化记录所有点赞与收藏的同人作品与互动小说。">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="retro.css">
  <link rel="stylesheet" href="archive-nav.css">
  <link rel="stylesheet" href="favorites.css">
<link rel="stylesheet" href="random-draw-modal.css"></head>
<body id="top" data-archive-view="favorites">
  <nav class="archive-nav" aria-label="网站导航"><a class="archive-nav__brand" href="index.html">閲読器作品記録</a><a class="archive-nav__link" data-nav-key="profile" data-tooltip="馆主档案" aria-label="馆主档案" href="profile.html"><b class="archive-nav__icon" aria-hidden="true"></b><span class="archive-nav__label">馆主档案</span></a><a class="archive-nav__link" data-nav-key="masterworks" data-tooltip="私心神作" aria-label="私心神作" href="masterworks.html"><b class="archive-nav__icon" aria-hidden="true"></b><span class="archive-nav__label">私心神作</span></a><a class="archive-nav__link" data-nav-key="works" data-tooltip="作品一览" aria-label="作品一览" href="works.html"><b class="archive-nav__icon" aria-hidden="true"></b><span class="archive-nav__label">作品一览</span></a><a class="archive-nav__link" data-nav-key="hp" data-tooltip="霍格沃茨特快" aria-label="霍格沃茨特快" href="hogwarts.html"><b class="archive-nav__icon" aria-hidden="true"></b><span class="archive-nav__label">霍格沃茨特快</span></a><a class="archive-nav__link" data-nav-key="celebrity" data-tooltip="真人区" aria-label="真人区" href="celebrity.html"><b class="archive-nav__icon" aria-hidden="true"></b><span class="archive-nav__label">真人区</span></a><a class="archive-nav__link" data-nav-key="favorites" data-tooltip="我的收藏" aria-label="我的收藏" href="favorites.html"><b class="archive-nav__icon" aria-hidden="true">♡</b><span class="archive-nav__label">我的收藏</span><span class="archive-nav__fav-count" hidden>0</span></a><a class="archive-nav__link" data-nav-key="search" data-tooltip="搜索与随机" aria-label="搜索与随机" href="search.html"><b class="archive-nav__icon" aria-hidden="true"></b><span class="archive-nav__label">搜索与随机</span></a></nav>

  <main class="favorites-page">
    <section class="favorites-page-hero">
      <div class="favorites-page-header">
        <p class="favorites-hero__kicker">VISITOR'S PRIVATE KEEPSAKE · LOCAL STORAGE</p>
        <h1 class="favorites-hero__title">
          <span>我的心选作品清单</span>
          <span class="favorites-hero__badge" id="fav-count-badge">0 部作品</span>
        </h1>
        <p class="favorites-hero__desc">
          所有被你点亮红心（Like / Favorite）的故事，都保存在你当前使用的设备浏览器中。随时查阅、按平台快速检索、一键复制书单，或导出备份以防清理缓存。
        </p>
      </div>
    </section>

    <!-- 筛选、检索与批量工具栏 -->
    <section class="favorites-controls" aria-label="心选作品操作栏">
      <div class="favorites-controls__left">
        <input type="search" id="fav-search" class="favorites-controls__search" placeholder="在心选中搜索作品名、标签、攻略角色…" aria-label="在心选中搜索">
        <select id="fav-platform" class="favorites-controls__select" aria-label="按平台筛选">
          <option value="">全部平台</option>
        </select>
        <select id="fav-sort" class="favorites-controls__select" aria-label="排序方式">
          <option value="time-desc">收藏时间（最新在先）</option>
          <option value="time-asc">收藏时间（最早在先）</option>
          <option value="rating-desc">推荐星级（从高到低）</option>
          <option value="name-asc">作品名称（拼音首字母）</option>
        </select>
      </div>
      <div class="favorites-controls__right">
        <button type="button" id="fav-poster-btn" class="fav-action-btn" style="background:#fff2f5;color:#c8426a;border-color:#f19db7;font-weight:700;" title="一键生成豆瓣风心选分享海报图片">🎨 生成分享海报</button>
        <button type="button" id="fav-copy-all" class="fav-action-btn" title="将收藏清单复制为排版纯文本">📋 复制书单文本</button>
        <button type="button" id="fav-export-json" class="fav-action-btn" title="导出数据为本地 JSON 备份文件">📥 导出备份</button>
        <label class="fav-action-btn" title="从此前导出的备份文件恢复" style="cursor:pointer">
          📤 导入恢复
          <input type="file" id="fav-import-json" accept=".json" style="display:none">
        </label>
        <button type="button" id="fav-clear-all" class="fav-action-btn fav-action-btn--danger" title="清空这台设备上的收藏记录">🗑️ 清空所有</button>
      </div>
    </section>

    <!-- 作品展示网格 -->
    <section class="shelves" style="max-width:1200px;margin:0 auto;padding:0 max(4vw,20px) 60px;">
      <div id="fav-catalog" class="grid"></div>

      <!-- 空白状态 -->
      <div id="fav-empty-view" class="favorites-empty-view" hidden>
        <div class="favorites-empty-view__icon">♡</div>
        <h2 class="favorites-empty-view__title">还没有收藏任何作品呢</h2>
        <p class="favorites-empty-view__desc">
          在全站浏览《閲読器作品記録》时，只要点击任意卡片右上角的小粉心 ♡，心动的故事就会悄悄珍藏在这里哦。
        </p>
        <div class="favorites-empty-view__actions">
          <a href="works.html" class="favorites-empty-view__link">📖 探索作品一览</a>
          <a href="masterworks.html" class="favorites-empty-view__link">✦ 翻翻私心神作</a>
          <a href="random.html" class="favorites-empty-view__link">🎲 随机抽一部</a>
        </div>
      </div>
    </section>
  </main>

  <footer>閲読器作品記録 · 访客私人心选档案</footer>

  <script src="works-data.js"></script>
  <script src="archive-nav-config.js"></script>
  <script src="archive-nav.js"></script>
  <script src="poster-generator.js"></script>
  <script src="favorites.js"></script>
  <script src="cover-mapping.js"></script>

  <script>
    // 独立清单页的渲染与响应逻辑
    (() => {
      const by = id => document.getElementById(id);
      const catalogEl = by('fav-catalog');
      const emptyEl = by('fav-empty-view');
      const countBadge = by('fav-count-badge');
      const searchInput = by('fav-search');
      const platformSelect = by('fav-platform');
      const sortSelect = by('fav-sort');

      function getRatingScore(rating) {
        if (!rating) return 0;
        const solidStars = (rating.match(/★/g) || []).length;
        if (rating.includes('弃游') || rating.includes('弃坑')) return -1;
        return solidStars;
      }

      function render() {
        const list = window.ArchiveFavorites.getFavoritesList();
        countBadge.textContent = `${list.length} 部作品`;

        // 更新平台筛选下拉框
        const platforms = [...new Set(list.map(w => w.platform).filter(Boolean))].sort();
        const curPlatform = platformSelect.value;
        platformSelect.innerHTML = '<option value="">全部平台 (' + list.length + ')</option>' +
          platforms.map(p => `<option value="${p}" ${p === curPlatform ? 'selected' : ''}>${p} (${list.filter(w=>w.platform===p).length})</option>`).join('');

        if (list.length === 0) {
          catalogEl.innerHTML = '';
          emptyEl.hidden = false;
          return;
        }

        emptyEl.hidden = true;

        // 过滤
        const q = searchInput.value.trim().toLowerCase();
        const p = platformSelect.value;
        const sort = sortSelect.value;

        let filtered = list.filter(w => {
          const matchQ = !q || [w.name, w.platform, w.status, ...(w.tags || []), w.characters || ''].join(' ').toLowerCase().includes(q);
          const matchP = !p || w.platform === p;
          return matchQ && matchP;
        });

        // 排序
        filtered.sort((a, b) => {
          if (sort === 'time-asc') return (a.addedAt || 0) - (b.addedAt || 0);
          if (sort === 'rating-desc') return getRatingScore(b.rating) - getRatingScore(a.rating);
          if (sort === 'name-asc') return (a.name || '').localeCompare(b.name || '', 'zh-CN');
          return (b.addedAt || 0) - (a.addedAt || 0); // time-desc default
        });

        if (filtered.length === 0) {
          catalogEl.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 48px 16px; color: #847266; font-size: 14px;">
              未找到符合当前条件的心选作品。试着更换关键词或筛选条件吧。
            </div>
          `;
          return;
        }

        catalogEl.innerHTML = filtered.map(w => {
          const chips = (w.tags || []).slice(0, 4).map(t => `<span>${t}</span>`).join('');
          return `
            <article class="card" data-work-id="${w.id}">
              <a href="works/${w.id}.html" class="card-link">
                <div class="cover verified">
                  <img src="assets/covers/${w.id}.png" alt="${w.name} 封面" loading="lazy" onerror="this.onerror=null;this.src='assets/covers/${w.id}.jpg';this.onerror=function(){this.style.opacity='0.4';}">
                  <small>作品封面</small>
                </div>
                <div class="card-body">
                  <p class="eyebrow">${w.platform || '同人'}${w.status ? ' · ' + w.status : ''}</p>
                  <h3>${w.name}</h3>
                  <span class="stars" aria-label="推荐指数 ${w.rating || '暂无评分'}">${w.rating || '暂无评分'}</span>
                  <div class="chips">${chips}</div>
                </div>
              </a>
            </article>
          `;
        }).join('');

        // 触发 cover-mapping 检查与收藏心形按钮挂载
        if (window.ArchiveFavorites) {
          window.ArchiveFavorites.updateAllUI();
        }
      }

      window.renderFavoritesPage = render;

      // 绑定工具栏事件
      searchInput.addEventListener('input', render);
      platformSelect.addEventListener('change', render);
      sortSelect.addEventListener('change', render);

      by('fav-poster-btn').addEventListener('click', () => {
        if (window.ArchivePosterGenerator) {
          window.ArchivePosterGenerator.openPosterModal();
        }
      });

      by('fav-copy-all').addEventListener('click', () => {
        window.ArchiveFavorites.copyFavoritesAsText();
      });

      by('fav-export-json').addEventListener('click', () => {
        window.ArchiveFavorites.exportFavoritesJson();
      });

      by('fav-import-json').addEventListener('change', (e) => {
        window.ArchiveFavorites.importFavoritesJson(e.target);
      });

      by('fav-clear-all').addEventListener('click', () => {
        window.ArchiveFavorites.clearAllFavorites();
      });

      document.addEventListener('DOMContentLoaded', render);
    })();
  </script>
<script src="pixel-badges.js"></script><script src="random-draw-modal.js"></script></body>
</html>
