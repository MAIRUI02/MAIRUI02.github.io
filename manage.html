<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>站主编辑台｜閲読器作品記録</title><link rel="stylesheet" href="style.css"><style>main{max-width:1200px}.notice{background:#f6ebdf;padding:16px 20px}.editor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:28px}.edit-card{border:1px solid var(--line);padding:12px;background:#fffdf8}.preview{aspect-ratio:4/5;background:#eee;position:relative;overflow:hidden;margin-bottom:10px}.preview img{width:100%;height:100%;object-fit:cover}.edit-card input[type=file]{width:100%;font-size:12px}.edit-card label{display:block;font-size:12px;margin-top:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.actions button,.actions a{padding:10px 14px;border:1px solid var(--wine);background:#fff;color:var(--wine);text-decoration:none;font:14px inherit;cursor:pointer}.actions button.primary{background:var(--wine);color:#fff}</style><body><nav class="top"><a href="index.html">← 返回网站</a><a class="logo" href="index.html">閲読器作品記録｜站主编辑台</a></nav><main><p class="kicker">OWNER TOOL</p><h1>封面编辑台</h1><div class="notice">这里的上传和裁切预览只保存在当前浏览器；点击“导出修改清单”后，把 JSON 与对应图片放入网站资源目录并重新发布，修改才会对访客永久生效。</div><div class="actions"><button class="primary" id="export">导出修改清单</button><button id="clear">清除本机预览</button><a href="index.html">打开前台首页</a></div><div id="list" class="editor-grid"></div></main><script>const key='ydq-cover-edits';let edits=JSON.parse(localStorage.getItem(key)||'{}');const save=()=>localStorage.setItem(key,JSON.stringify(edits));fetch('index.html').then(r=>r.text()).then(t=>{let d=document.createElement('div');d.innerHTML=t;let cards=[...d.querySelectorAll('#catalog .card')];document.querySelector('#list').innerHTML=cards.map(c=>{let a=c.querySelector('a'),name=c.querySelector('h3').textContent.trim(),img=c.querySelector('img'),id=a.getAttribute('href').replace('works/','').replace('.html','');return `<section class="edit-card" data-id="${id}"><div class="preview">${img?`<img src="${img.getAttribute('src')}" style="object-position:${edits[id]?.position||'50% 50%'}">`:'<span>默认封面</span>'}</div><b>${name}</b><label>替换图片 <input type="file" accept="image/*"></label><label>裁切位置 <input type="range" min="0" max="100" value="${parseInt(edits[id]?.position||'50')}" class="position"></label></section>`}).join('');document.querySelectorAll('.edit-card').forEach(card=>{let id=card.dataset.id,pos=card.querySelector('.position'),img=card.querySelector('img');pos.oninput=()=>{edits[id]={...(edits[id]||{}),position:pos.value+'% 50%'};if(img)img.style.objectPosition=edits[id].position;save()};card.querySelector('input[type=file]').onchange=e=>{let f=e.target.files[0];if(!f)return;edits[id]={...(edits[id]||{}),file:f.name,position:edits[id]?.position||'50% 50%'};let u=URL.createObjectURL(f);if(img)img.src=u;else card.querySelector('.preview').innerHTML=`<img src="${u}" style="object-position:${edits[id].position}">`;save()}})}).catch(()=>document.querySelector('#list').innerHTML='<p>请通过静态服务器或部署后的网址打开此页面，便于读取作品目录。</p>');document.querySelector('#export').onclick=()=>{let b=new Blob([JSON.stringify(edits,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cover-overrides.json';a.click()};document.querySelector('#clear').onclick=()=>{localStorage.removeItem(key);location.reload()};</script></body></html>
